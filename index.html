<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>履歷表</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eef1;color:#263942;font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:13px;line-height:1.5}.tools{max-width:1000px;margin:22px auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 20px}.tools strong{margin-right:auto}button,.upload{border:1px solid #c7d2d7;background:white;color:#294955;border-radius:7px;padding:9px 14px;cursor:pointer;font:inherit}button.primary{background:#284f60;color:white;border-color:#284f60}.hint{max-width:794px;margin:0 auto 14px;color:#5c7079;padding:0 12px;font-size:12px}.sheet{width:794px;min-height:1123px;margin:0 auto 32px;background:#fff;padding:32px 38px;box-shadow:0 8px 40px #29495514}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #294f60;padding-bottom:14px;margin-bottom:15px}h1{font-size:29px;letter-spacing:8px;margin:0;font-weight:600}header small{font-size:10px;letter-spacing:3px;color:#6b8089}h2{font-size:13px;letter-spacing:2px;margin:13px 0 7px;color:#294f60;display:flex;align-items:center;gap:10px}h2:after{content:'';height:1px;background:#d9e2e6;flex:1}.basic{display:grid;grid-template-columns:1fr 108px;gap:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px}.field{display:flex;align-items:baseline;gap:8px;min-width:0}.field.wide{grid-column:1/-1}label{color:#5a707c;font-size:11px;white-space:nowrap}input,select,textarea{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid #dce4e8;border-radius:0;padding:3px 2px;min-width:0;width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:#47788d;background:#f0f7fa}textarea{resize:vertical;line-height:1.6}input::placeholder,textarea::placeholder{color:#a4b0b7;font-size:11px}.photo{width:108px;height:139px;background:#f2f5f6;border:1px dashed #bfccd3;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;text-align:center;color:#78909b;font-size:11px}.photo img{width:100%;height:100%;object-fit:cover}.photo span{padding:10px}table{border-collapse:collapse;width:100%;table-layout:fixed}th{text-align:left;background:#edf3f5;color:#607682;font-weight:normal;font-size:11px;padding:5px 7px}td{padding:3px 6px;border-bottom:1px solid #e3e9ec;vertical-align:top}td input,td select{border:0;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px}.bio{height:125px;background:repeating-linear-gradient(white,white 25px,#edf1f3 26px);line-height:26px;border:0;padding:0 5px}.foot{margin-top:12px;text-align:right;font-size:10px;color:#91a0a8}.status{font-size:12px;color:#5f7782}#file,#photoFile{display:none}@media(max-width:820px){.sheet{width:calc(100% - 24px);padding:24px;min-height:0}.fields,.two{grid-template-columns:1fr}.field.wide{grid-column:auto}.basic{grid-template-columns:1fr 90px;gap:12px}.photo{width:90px;height:120px}h1{font-size:25px}.tools{margin:14px auto}table input{font-size:11px}th,td{padding:4px 2px}.hint{padding:0 20px}}@media print{@page{size:A4;margin:10mm}body{background:white;font-size:12px}.tools,.hint{display:none}.sheet{width:100%;min-height:0;margin:0;padding:0;box-shadow:none}input,select,textarea{appearance:none;border:0;padding:2px 0}input::placeholder,textarea::placeholder{color:transparent}h2{break-after:avoid}section,table,.basic{break-inside:avoid}header{margin-bottom:10px}h2{margin-top:10px}.photo{border:0;background:white}.photo span{visibility:hidden}.bio{height:125px}.foot{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* One continuous table with merged category cells. */
.grid-on .resume-table{border:1px solid #82939d}
.grid-on .resume-table section{display:grid;grid-template-columns:45px minmax(0,1fr);border:0;margin:0}
.grid-on .resume-table section+section{border-top:1px solid #82939d}
.grid-on .resume-table h2{writing-mode:vertical-rl;letter-spacing:3px;justify-content:center;align-items:center;padding:14px 8px;border:0;border-right:1px solid #82939d;background:#f0f4f6;font-size:13px}
.grid-on .section-body{min-width:0}
.grid-on .section-body>.field{margin-bottom:0!important}
.grid-on .basic{grid-template-columns:minmax(0,1fr) 108px}
.grid-on .fields{border-right:1px solid #a9b5bc}
.grid-on .photo{width:96px;height:128px}
.grid-on .field{border-bottom:1px solid #a9b5bc}
.grid-on .fields>.field:last-child,.grid-on .two>.field:last-child{border-bottom:0}
.grid-on td:first-child,.grid-on th:first-child{border-left:0}
.grid-on td:last-child,.grid-on th:last-child{border-right:0}
.grid-on .add-row{margin:4px 6px}
.grid-on .skill-add{margin:0;padding:3px 6px;border-top:1px solid #a9b5bc}
.grid-on .bio{display:block;width:100%;margin:0;min-height:140px;background:white}
@media(max-width:600px){.grid-on .resume-table section{grid-template-columns:34px minmax(0,1fr)}.grid-on .resume-table h2{padding:10px 4px;font-size:12px}.grid-on .basic{grid-template-columns:minmax(0,1fr) 86px}.grid-on .photo{width:78px;height:104px}.grid-on .field label{min-width:65px}}

</style></head><body><nav class="tools"><strong>履歷表製作</strong><button id="save" class="primary">下載已填履歷 HTML</button><button id="export">匯出資料</button><button id="import">匯入資料</button><button id="pdf" class="primary">直接下載 PDF</button><button id="reset">清空</button><label class="grid-switch"><input type="checkbox" id="gridToggle" checked> 顯示格線</label><span class="status" id="status"></span></nav><p class="hint">直接點選欄位填寫，點照片框上傳證件照。下載 HTML 可保留資料與照片；點「直接下載 PDF」即可輸出 A4，不含日期與網址。</p><main class="sheet grid-on"><header><h1>履歷表</h1></header><div class="resume-table"><section><h2>基本資料</h2><div class="section-body"><div class="basic"><div class="fields" id="basic"></div><label class="photo" for="photoFile"><span>上傳證件照<br>建議直式 3 : 4</span><img id="portrait" alt="證件照" hidden></label></div></div></section><section><h2>學歷</h2><div class="section-body"><table><thead><tr><th style="width:17%">學歷</th><th style="width:28%">學校名稱</th><th style="width:25%">科系所</th><th style="width:14%">狀況</th><th>畢／肄業年月</th></tr></thead><tbody id="education"></tbody></table><button class="add-row" data-add="education">＋新增學歷</button></div></section><section><h2>工作經歷</h2><div class="section-body"><div class="field" style="margin-bottom:6px"><label>累計工作經驗</label><input data-key="years" placeholder="無工作經驗／工作年資 ○ 年"></div><table><thead><tr><th style="width:26%">公司名稱</th><th style="width:20%">工作職稱</th><th style="width:31%">工作說明</th><th>任職期間／薪資</th></tr></thead><tbody id="work"></tbody></table><button class="add-row" data-add="work">＋新增工作經歷</button></div></section><section><h2>工作志願</h2><div class="section-body"><div class="two" id="goals"></div></div></section><section><h2>背景與專長</h2><div class="section-body"><div class="two" id="skills"></div><div class="skill-add"><select id="skillType" aria-label="新增項目類型"><option value="expertise">專長</option><option value="certificate">證照及級別</option><option value="language">語文能力</option><option value="license">駕照／交通工具</option><option value="computer">電腦能力</option></select><button class="add-row" id="addSkill">＋新增項目</button></div></div></section><section><h2>自傳</h2><div class="section-body"><textarea class="bio" data-key="bio" aria-label="自傳" placeholder="可填寫自我介紹、工作態度、相關經驗與未來目標。"></textarea></div></section></div><div class="foot">個人履歷 · 資料由本人填寫</div></main><input type="file" id="photoFile" accept="image/*"><input type="file" id="file" accept="application/json,.json"><script id="resume-data" type="application/json">{}</script><script>
const $=s=>document.querySelector(s);let photo='';
function field(k,label,placeholder='',wide=false){return `<div class="field ${wide?'wide':''}"><label for="${k}">${label}</label><input id="${k}" data-key="${k}" placeholder="${placeholder}"></div>`}
$('#basic').innerHTML=[['name','姓名',''],['gender','性別',''],['id','身分證號碼',''],['birth','出生日期','年／月／日'],['marriage','婚姻狀況',''],['military','兵役狀況',''],['phone','聯絡電話',''],['mobile','行動電話',''],['email','電子信箱','',true],['address','聯絡地址','含郵遞區號',true]].map(x=>field(...x)).join('');
let rowSerial=3;
const columns={education:['level','school','department','state','date'],work:['company','title','description','period']};
const skillLabels={language:'語文能力',license:'駕照／交通工具',expertise:'專長',certificate:'證照及級別',computer:'電腦能力'};
function addRow(group,id){id=id??'r'+rowSerial++;const tr=document.createElement('tr');tr.dataset.row=id;tr.innerHTML=columns[group].map((k,j)=>`<td><input aria-label="${group==='education'?'學歷':'工作'} ${k}" data-key="${group==='education'?'edu':'work'}${id}_${k}">${j===columns[group].length-1?'<button class="row-action" type="button" aria-label="刪除此筆">刪除</button>':''}</td>`).join('');tr.querySelector('button').onclick=()=>tr.remove();$('#'+group).append(tr)}
function addSkill(type,key){key=key??type+'_'+rowSerial++;const box=document.createElement('div');box.className='field';box.dataset.skill=type;box.innerHTML=`<label></label><input><button class="row-action" type="button" aria-label="刪除此項目">刪除</button>`;box.querySelector('label').textContent=skillLabels[type]||'專長';const input=box.querySelector('input');input.dataset.key=key;input.id=key;box.querySelector('label').htmlFor=key;box.querySelector('button').onclick=()=>box.remove();$('#skills').append(box)}
for(let i=0;i<3;i++){addRow('education',String(i));addRow('work',String(i))}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addRow(b.dataset.add));$('#addSkill').onclick=()=>addSkill($('#skillType').value);$('#gridToggle').onchange=()=>$('.sheet').classList.toggle('grid-on',$('#gridToggle').checked);
$('#goals').innerHTML=[['job','希望職務','可填寫多個職務'],['area','工作地區',''],['salary','希望待遇','月薪／日薪／時薪／面議'],['schedule','工作時間','日班／夜班／輪班／部分工時']].map(x=>field(...x)).join('');Object.keys(skillLabels).forEach(k=>addSkill(k,k));
function collect(){const d={};document.querySelectorAll('[data-key]').forEach(e=>d[e.dataset.key]=e.value);return {version:2,fields:d,photo,grid:$('#gridToggle').checked,rows:{education:[...$('#education').children].map(e=>e.dataset.row),work:[...$('#work').children].map(e=>e.dataset.row),skills:[...$('#skills').children].map(e=>({type:e.dataset.skill,key:e.querySelector('input').dataset.key}))}}}
function apply(d){
 if(d.rows){for(const group of ['education','work']){const ids=d.rows[group];if(!Array.isArray(ids)||ids.length>100)throw Error('資料筆數不正確');$('#'+group).innerHTML='';ids.forEach(id=>{if(!/^(\d+|r\d+)$/.test(String(id)))throw Error('資料格式不正確');addRow(group,String(id));rowSerial=Math.max(rowSerial,Number(String(id).replace('r',''))+1)})}$('#skills').innerHTML='';if(!Array.isArray(d.rows.skills)||d.rows.skills.length>100)throw Error('資料筆數不正確');d.rows.skills.forEach(item=>{if(!skillLabels[item.type]||!/^\w+$/.test(item.key))throw Error('資料格式不正確');addSkill(item.type,item.key);rowSerial=Math.max(rowSerial,Number(item.key.split('_').pop())+1||3)})}
 $('#gridToggle').checked=d.grid!==false;$('.sheet').classList.toggle('grid-on',$('#gridToggle').checked);
 document.querySelectorAll('[data-key]').forEach(e=>e.value=String(d.fields?.[e.dataset.key]??''));photo=typeof d.photo==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(d.photo)?d.photo:'';$('#portrait').hidden=!photo;if(photo)$('#portrait').src=photo;else $('#portrait').removeAttribute('src');$('.photo span').hidden=!!photo}
function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('#export').onclick=()=>download('resume-data.json',JSON.stringify(collect(),null,2),'application/json');$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.fields||typeof d.fields!=='object')throw Error();apply(d);$('#status').textContent='已匯入資料'}catch{$('#status').textContent='無法讀取，請選擇匯出的履歷 JSON'}e.target.value=''};
$('#photoFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const bitmap=await createImageBitmap(f);const c=document.createElement('canvas');const ratio=Math.min(1,600/Math.max(bitmap.width,bitmap.height));c.width=Math.round(bitmap.width*ratio);c.height=Math.round(bitmap.height*ratio);c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.9);bitmap.close();apply(collect());$('#status').textContent='照片已載入'}catch{$('#status').textContent='照片格式無法讀取'}e.target.value=''};
$('#save').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#resume-data').textContent=JSON.stringify(collect()).replace(/</g,'\\u003c');clone.querySelector('#status').textContent='';download('resume.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8');$('#status').textContent='已下載，請保留此檔案'};$('#reset').onclick=()=>{if(confirm('確定清空所有資料與照片？')){apply({});$('#status').textContent='已清空'}};try{apply(JSON.parse($('#resume-data').textContent))}catch{};

// Offline PDF export: draw the entered data and photo, then embed the JPEG in an A4 PDF.
function makePDF(jpeg,w,h){
 const raw=atob(jpeg.split(',')[1]),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),enc=new TextEncoder(),parts=[],offsets=[0];let length=0;
 const add=v=>{const b=typeof v==='string'?enc.encode(v):v;parts.push(b);length+=b.length};
 const obj=(n,v)=>{offsets[n]=length;add(n+' 0 obj\n');add(v);add('\nendobj\n')};
 add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 offsets[4]=length;add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');add(bytes);add('\nendstream\nendobj\n');
 const scale=Math.min(595.28/w,841.89/h),pw=w*scale,ph=h*scale;
 const stream='q\n'+pw.toFixed(3)+' 0 0 '+ph.toFixed(3)+' '+((595.28-pw)/2).toFixed(3)+' '+(841.89-ph).toFixed(3)+' cm\n/Im0 Do\nQ';
 obj(5,'<< /Length '+enc.encode(stream).length+' >>\nstream\n'+stream+'\nendstream');const start=length;add('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');return new Blob(parts,{type:'application/pdf'});
}
$('#pdf').onclick=async()=>{
 const button=$('#pdf');button.disabled=true;$('#status').textContent='正在產生 PDF…';
 try{
 await document.fonts.ready;const data=collect(),grid=data.grid,d=data.fields,W=794,S=2,c=document.createElement('canvas');c.width=W*S;c.height=12000;const x=c.getContext('2d');x.scale(S,S);x.fillStyle='white';x.fillRect(0,0,W,6000);
 const font=(size=12,bold=false)=>x.font=(bold?'600 ':'')+size+'px DFKai-SB, BiauKai, KaiTi, serif';
 const text=(t,a,b,size=12,color='#263942',bold=false)=>{font(size,bold);x.fillStyle='#000';x.fillText(String(t||''),a,b)};
 const line=(a,b,z)=>{x.strokeStyle='#d9e2e6';x.lineWidth=.7;x.beginPath();x.moveTo(a,b);x.lineTo(z,b);x.stroke()};
 const rect=(a,b,w,h)=>{if(!grid)return;x.strokeStyle='#8c9ca4';x.lineWidth=.7;x.strokeRect(a,b,w,h)};
 const wrap=(t,width,size=12)=>{font(size);let lines=[],v='';for(const ch of String(t||'')){if(ch==='\n'){lines.push(v);v='';continue}if(v&&x.measureText(v+ch).width>width){lines.push(v);v=''}v+=ch}lines.push(v);return lines};
 const draw=(t,a,b,width,size=12)=>{const ls=wrap(t,width,size);ls.forEach((v,i)=>text(v,a,b+i*(size+5),size));return ls.length*(size+5)};
 let y=58;text('履 歷 表',38,y,29,'#294f60',true);y+=18;line(38,y,756);y+=28;
 const tableTop=y-17;const section=t=>{if(grid){x.fillStyle='#fff';x.fillRect(38,y-17,718,28);rect(38,y-17,718,28);text(t,46,y+2,13,'#294f60',true);y+=28}else{text(t,38,y,13,'#294f60',true);line(164,y-4,756);y+=22}};
 const pairRows=(items,width=718)=>{for(let i=0;i<items.length;i+=2){const start=y;let heights=[];for(let j=0;j<2&&i+j<items.length;j++){const [label,key]=items[i+j],left=38+j*width/2;text(label,left+5,y,11,'#5a707c');heights.push(draw(d[key],left+96,y,width/2-108))}const height=Math.max(27,...heights.map(h=>h+8));for(let j=0;j<2&&i+j<items.length;j++){rect(38+j*width/2,start-17,width/2,height);rect(38+j*width/2,start-17,90,height)}y+=height}};
 section('基本資料');const top=y;
 pairRows([['姓名','name'],['性別','gender'],['身分證號碼','id'],['出生日期','birth'],['婚姻狀況','marriage'],['兵役狀況','military'],['聯絡電話','phone'],['行動電話','mobile']],610);
 for(const [label,key] of [['電子信箱','email'],['聯絡地址','address']]){const start=y;text(label,43,y,11,'#5a707c');y+=Math.max(27,draw(d[key],134,y,478)+8);rect(38,start-17,610,y-start);rect(38,start-17,90,y-start)}
 if(photo){const img=new Image();img.src=photo;await img.decode();const photoHeight=y-top;const a=img.naturalWidth/img.naturalHeight,box=108/photoHeight;let sw=img.naturalWidth,sh=img.naturalHeight;if(a>box)sw=sh*box;else sh=sw/box;x.drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sh)/2,sw,sh,648,top-17,108,photoHeight)}
 rect(648,top-17,108,y-top);section('學歷');
 function table(headers,widths,rows){let left=38;x.fillStyle='#fff';x.fillRect(left,y-17,718,24);headers.forEach((t,i)=>{text(t,left+6,y+2,11,'#607682');rect(left,y-17,widths[i],24);left+=widths[i]});y+=24;rows.forEach(row=>{let l=38;const lists=row.map((t,i)=>wrap(t,widths[i]-12));const height=Math.max(27,...lists.map(ls=>ls.length*16+8));lists.forEach((ls,i)=>{ls.forEach((v,j)=>text(v,l+6,y+j*16,11));rect(l,y-17,widths[i],height);l+=widths[i]});y+=height;if(!grid)line(38,y-12,756)});if(!grid)y+=8}
